<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>api call</title>
      <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f8fa;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    #posts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .post {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: 0.3s;
    }
    .post:hover {
      transform: translateY(-3px);
    }
    button {
      display: block;
      margin: 0 auto;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }

    </style>
</head>
<body>
      <h2>📦 Latest Posts (Dynamic from API)</h2>
  <button id="loadBtn">Fetch Posts</button>

      <div id="posts"></div>

        <button id="loadMoreBtn">Load More</button>


    <script src="api.js"></script>
</body>
</html>
